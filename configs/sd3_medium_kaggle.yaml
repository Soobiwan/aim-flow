model:
  model_id: "stabilityai/stable-diffusion-3-medium-diffusers"
  dtype: "float16"
  enable_model_cpu_offload: true
  enable_attention_slicing: false
  enable_vae_slicing: true
  load_t5_text_encoder: false

sampler:
  height: 512
  width: 512
  num_inference_steps: 24
  guidance_scale: 4.5
  seed: 42

aim_flow:
  mode: "aim_v2"
  lambda_global: 0.75
  lambda_schedule: "middle_late"
  max_primitives: 5
  sequential_primitive_forward: true

  vfa:
    enabled: true
    use_anchor_augmented_primitives: true
    use_full_prompt_consistency: true
    use_delta_full_gate: true
    conflict_threshold: -0.10
    velocity_clip_ratio: 0.35
    min_gate: 0.0
    max_gate: 1.0

  ltp:
    enabled: true
    mode: "latent"
    radius_ratio: 0.30
    early_radius_ratio: 0.20
    middle_radius_ratio: 0.35
    late_radius_ratio: 0.25
    fallback_to_velocity_ltp: true
